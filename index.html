<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rob's Guinness Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      height: 55px;
      background: #111;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 15px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      white-space: nowrap;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 5px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #loginButton,
    #addGuinnessButton,
    #addPubButton {
      background: white;
      color: #111;
    }

    #logoutButton {
      background: #555;
      color: white;
    }

    #loggedInText {
      display: none;
      font-size: 14px;
    }

    /* =========================
       MAP
       ========================= */

    #map {
      height: calc(100vh - 55px);
    }

    /* =========================
       GUINNESS MARKER
       ========================= */

    .guinness-marker {
      width: 32px;
      height: 32px;

      background: black;
      border: 3px solid white;
      border-radius: 50%;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
      font-size: 14px;

      box-sizing: border-box;
    }

    /* =========================
       TOWN SEARCH
       ========================= */

    .search-box {
      position: absolute;

      top: 65px;
      right: 10px;

      z-index: 1000;

      background: white;
      padding: 8px;

      border-radius: 5px;

      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }

    .search-box input {
      width: 140px;

      padding: 7px;

      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .search-box button {
      background: #111;
      color: white;
      margin-left: 4px;
    }

    /* =========================
       CURRENT LOCATION BUTTON
       ========================= */

    .location-button {
      position: absolute;

      top: 125px;
      left: 10px;

      z-index: 1000;

      width: 34px;
      height: 34px;

      padding: 0;

      background: white;

      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 4px;

      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);

      cursor: pointer;

      font-size: 18px;
      line-height: 30px;
      text-align: center;
    }

    /* =========================
       MODALS
       ========================= */

    .modal {
      display: none;

      position: fixed;

      z-index: 2000;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.55);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal-content {
      background: white;

      width: 100%;
      max-width: 420px;

      max-height: 90vh;
      overflow-y: auto;

      border-radius: 8px;

      padding: 20px;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;

      font-weight: bold;

      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;

      padding: 9px;

      border: 1px solid #ccc;

      border-radius: 4px;

      font-size: 15px;
    }

    .form-group textarea {
      min-height: 90px;

      resize: vertical;
    }

    .modal-buttons {
      display: flex;

      gap: 8px;

      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .primary-button {
      background: #111;
      color: white;
    }

    .secondary-button {
      background: #ddd;
      color: #111;
    }

    .location-form-button {
      width: 100%;

      margin-top: 6px;

      background: #eee;
      color: #111;
    }

    .error-message {
      color: #b00020;

      font-size: 14px;

      margin-top: 10px;
    }

    .success-message {
      color: #087f23;

      font-size: 14px;

      margin-top: 10px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      header {
        padding: 0 8px;
      }

      header h1 {
        font-size: 16px;
      }

      .header-buttons {
        gap: 4px;
      }

      .header-buttons button {
        padding: 7px 8px;
        font-size: 12px;
      }

      #loggedInText {
        display: none !important;
      }

      .search-box {
        top: 65px;
        right: 8px;
      }

      .search-box input {
        width: 110px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <header>

    <h1>Rob's Guinness Map</h1>

    <div class="header-buttons">

      <span id="loggedInText">
        Logged in
      </span>

      <button
        id="addGuinnessButton"
        style="display: none;"
      >
        + Add Guinness
      </button>

      <button
        id="addPubButton"
        style="display: none;"
      >
        + Add Pub
      </button>

      <button id="loginButton">
        Login
      </button>

      <button
        id="logoutButton"
        style="display: none;"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <!-- =========================
       TOWN SEARCH
       ========================= -->

  <div class="search-box">

    <input
      id="townSearch"
      type="text"
      placeholder="Search town"
    >

    <button id="searchButton">
      Search
    </button>

  </div>


  <!-- =========================
       CURRENT LOCATION
       ========================= -->

  <button
    class="location-button"
    id="locationButton"
    title="Current location"
    aria-label="Current location"
  >
    ⦿
  </button>


  <!-- =========================
       LOGIN MODAL
       ========================= -->

  <div
    class="modal"
    id="loginModal"
  >

    <div class="modal-content">

      <h2>Login</h2>

      <div class="form-group">

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          autocomplete="email"
        >

      </div>


      <div class="form-group">

        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
        >

      </div>


      <div
        id="loginError"
        class="error-message"
      ></div>


      <div class="modal-buttons">

        <button
          class="secondary-button"
          id="closeLoginButton"
        >
          Cancel
        </button>

        <button
          class="primary-button"
          id="submitLoginButton"
        >
          Login
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       ADD GUINNESS MODAL
       ========================= -->

  <div
    class="modal"
    id="guinnessModal"
  >

    <div class="modal-content">

      <h2>Add Guinness</h2>


      <div class="form-group">

        <label for="guinnessPub">
          Pub
        </label>

        <select id="guinnessPub">

          <option value="">
            Choose a pub
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="guinnessDate">
          Date
        </label>

        <input
          type="date"
          id="guinnessDate"
        >

      </div>


      <div class="form-group">

        <label for="guinnessRating">
          Rating
        </label>

        <input
          type="number"
          id="guinnessRating"
          min="1"
          max="5"
          step="1"
          placeholder="1-5"
        >

      </div>


      <div class="form-group">

        <label for="guinnessPrice">
          Price
        </label>

        <input
          type="number"
          id="guinnessPrice"
          min="0"
          step="0.01"
          placeholder="e.g. 5.20"
        >

      </div>


      <div class="form-group">

        <label for="guinnessNotes">
          Notes
        </label>

        <textarea
          id="guinnessNotes"
          placeholder="Optional notes"
        ></textarea>

      </div>


      <div
        id="guinnessError"
        class="error-message"
      ></div>


      <div
        id="guinnessSuccess"
        class="success-message"
      ></div>


      <div class="modal-buttons">

        <button
          class="secondary-button"
          id="closeGuinnessButton"
        >
          Cancel
        </button>

        <button
          class="primary-button"
          id="saveGuinnessButton"
        >
          Save Guinness
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       ADD PUB MODAL
       ========================= -->

  <div
    class="modal"
    id="pubModal"
  >

    <div class="modal-content">

      <h2>Add Pub</h2>


      <div class="form-group">

        <label for="pubName">
          Pub name
        </label>

        <input
          type="text"
          id="pubName"
          placeholder="Pub name"
        >

      </div>


      <div class="form-group">

        <label for="pubTown">
          Town
        </label>

        <input
          type="text"
          id="pubTown"
          placeholder="Town"
        >

      </div>


      <div class="form-group">

        <label for="pubLatitude">
          Latitude
        </label>

        <input
          type="number"
          id="pubLatitude"
          step="any"
          placeholder="Latitude"
        >

      </div>


      <div class="form-group">

        <label for="pubLongitude">
          Longitude
        </label>

        <input
          type="number"
          id="pubLongitude"
          step="any"
          placeholder="Longitude"
        >

      </div>


      <button
        class="location-form-button"
        id="usePubLocationButton"
      >
        Use current location
      </button>


      <div
        id="pubError"
        class="error-message"
      ></div>


      <div
        id="pubSuccess"
        class="success-message"
      ></div>


      <div class="modal-buttons">

        <button
          class="secondary-button"
          id="closePubButton"
        >
          Cancel
        </button>

        <button
          class="primary-button"
          id="savePubButton"
        >
          Save Pub
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       LEAFLET
       ========================= -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- =========================
       SUPABASE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================================================
       SUPABASE CONFIGURATION
       =========================================================

       Replace the two values below with the SAME values that
       are already working in your current version.

       Do NOT put your Supabase Secret / Service Role key here.
       ========================================================= */

    const SUPABASE_URL =
      "https://pteassljmnepsbfzxjks.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_xlodpsQzM2DOUbBDgMcZIg_KkS-ZOTl";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       MAP
       ========================================================= */

    const map = L.map("map").setView(
      [54.65, -3.4],
      10
    );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    /*
      All Guinness pub markers are kept inside this layer.
      This lets us clear and redraw them after adding data.
    */

    const markerLayer =
      L.layerGroup().addTo(map);


    /*
      Temporary marker used when finding the user's
      current location.
    */

    let currentLocationMarker = null;


    /* =========================================================
       HTML ELEMENTS
       ========================================================= */

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const loggedInText =
      document.getElementById("loggedInText");

    const addGuinnessButton =
      document.getElementById("addGuinnessButton");

    const addPubButton =
      document.getElementById("addPubButton");


    const loginModal =
      document.getElementById("loginModal");

    const guinnessModal =
      document.getElementById("guinnessModal");

    const pubModal =
      document.getElementById("pubModal");


    const pubSelect =
      document.getElementById("guinnessPub");


    /* =========================================================
       LOGIN STATE
       ========================================================= */

    let currentUser = null;


    async function updateLoginState() {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      currentUser =
        session ? session.user : null;


      if (currentUser) {

        loggedInText.style.display =
          "inline";

        logoutButton.style.display =
          "inline-block";

        loginButton.style.display =
          "none";

        addGuinnessButton.style.display =
          "inline-block";

        addPubButton.style.display =
          "inline-block";

      } else {

        loggedInText.style.display =
          "none";

        logoutButton.style.display =
          "none";

        loginButton.style.display =
          "inline-block";

        addGuinnessButton.style.display =
          "none";

        addPubButton.style.display =
          "none";
      }
    }


    /*
      Keep the UI in sync if the authentication state changes.
    */

    supabaseClient.auth.onAuthStateChange(
      async () => {
        await updateLoginState();
      }
    );


    /* =========================================================
       LOAD PUBS AND GUINNESSES
       ========================================================= */

    async function loadPubs() {

      /*
        Remove existing markers first.

        This prevents duplicate markers appearing when we
        refresh the map after adding a Guinness or pub.
      */

      markerLayer.clearLayers();


      /*
        Get pubs.
      */

      const {
        data: pubs,
        error: pubsError
      } =
        await supabaseClient
          .from("pubs")
          .select("*");


      if (pubsError) {

        console.error(
          "Error loading pubs:",
          pubsError
        );

        return;
      }


      /*
        IMPORTANT:

        The table is deliberately spelled "guinesses"
        because that is the name of your table.
      */

      const {
        data: guinesses,
        error: guinnessError
      } =
        await supabaseClient
          .from("guinesses")
          .select("*");


      if (guinnessError) {

        console.error(
          "Error loading guinesses:",
          guinnessError
        );

        return;
      }


      /*
        Create a marker for every pub.
      */

      pubs.forEach(pub => {

        /*
          Find all Guinness records belonging to this pub.
        */

        const pubGuinnesses =
          guinesses.filter(
            g =>
              Number(g.pub_id) ===
              Number(pub.id)
          );


        /*
          Guinness count.
        */

        const count =
          pubGuinnesses.length;


        /*
          Calculate average rating.

          Blank ratings are ignored.
        */

        const ratings =
          pubGuinnesses
            .map(g => Number(g.rating))
            .filter(
              value =>
                !isNaN(value)
            );


        const averageRating =
          ratings.length > 0
            ? (
                ratings.reduce(
                  (total, value) =>
                    total + value,
                  0
                ) /
                ratings.length
              ).toFixed(1)
            : null;


        /*
          Calculate average price.

          Blank prices are ignored.
        */

        const prices =
          pubGuinnesses
            .map(g => Number(g.price))
            .filter(
              value =>
                !isNaN(value)
            );


        const averagePrice =
          prices.length > 0
            ? (
                prices.reduce(
                  (total, value) =>
                    total + value,
                  0
                ) /
                prices.length
              ).toFixed(2)
            : null;


        /*
          Create the black circular marker.
        */

        const icon =
          L.divIcon({

            className: "",

            html:
              `<div class="guinness-marker">${count}</div>`,

            iconSize: [
              38,
              38
            ],

            iconAnchor: [
              19,
              19
            ],

            popupAnchor: [
              0,
              -20
            ]

          });


        /*
          Build popup.
        */

        let popup =
          `<strong>${escapeHtml(pub.name)}</strong><br>` +
          `${escapeHtml(pub.town || "")}<br><br>` +
          `<strong>Guinnesses:</strong> ${count}<br>`;


        /*
          Average rating.
        */

        if (averageRating !== null) {

          popup +=
            `<strong>Average rating:</strong> ` +
            `${averageRating}/5<br>`;

        } else {

          popup +=
            `<strong>Average rating:</strong> ` +
            `Not rated<br>`;
        }


        /*
          Average price.
        */

        if (averagePrice !== null) {

          popup +=
            `<strong>Average price:</strong> ` +
            `£${averagePrice}`;

        } else {

          popup +=
            `<strong>Average price:</strong> ` +
            `No prices recorded`;
        }


        /*
          Add marker to map.
        */

        L.marker(
          [
            Number(pub.latitude),
            Number(pub.longitude)
          ],
          {
            icon: icon
          }
        )
          .bindPopup(popup)
          .addTo(markerLayer);

      });


      /*
        Rebuild the pub dropdown used by Add Guinness.
      */

      pubSelect.innerHTML =
        '<option value="">Choose a pub</option>';


      pubs.forEach(pub => {

        const option =
          document.createElement("option");


        option.value =
          pub.id;


        option.textContent =
          `${pub.name} — ${pub.town}`;


        pubSelect.appendChild(option);

      });

    }


    /* =========================================================
       HTML ESCAPING
       =========================================================

       This prevents text entered as a pub name or town from
       being interpreted as HTML inside a popup.
       ========================================================= */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================================================
       LOGIN
       ========================================================= */

    loginButton.addEventListener(
      "click",
      () => {

        document.getElementById(
          "loginError"
        ).textContent = "";

        loginModal.style.display =
          "flex";
      }
    );


    document.getElementById(
      "closeLoginButton"
    ).addEventListener(
      "click",
      () => {

        loginModal.style.display =
          "none";
      }
    );


    document.getElementById(
      "submitLoginButton"
    ).addEventListener(
      "click",
      async () => {

        const email =
          document.getElementById(
            "loginEmail"
          ).value.trim();


        const password =
          document.getElementById(
            "loginPassword"
          ).value;


        const errorBox =
          document.getElementById(
            "loginError"
          );


        errorBox.textContent = "";


        if (!email || !password) {

          errorBox.textContent =
            "Please enter your email and password.";

          return;
        }


        const {
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {

          console.error(error);

          errorBox.textContent =
            error.message;

          return;
        }


        loginModal.style.display =
          "none";


        document.getElementById(
          "loginEmail"
        ).value = "";

        document.getElementById(
          "loginPassword"
        ).value = "";

      }
    );


    /* =========================================================
       LOGOUT
       ========================================================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        const {
          error
        } =
          await supabaseClient.auth
            .signOut();


        if (error) {

          console.error(
            "Logout error:",
            error
          );

          return;
        }


        await updateLoginState();

      }
    );


    /* =========================================================
       ADD GUINNESS MODAL
       ========================================================= */

    addGuinnessButton.addEventListener(
      "click",
      async () => {

        if (!currentUser) {

          alert("Please log in first.");

          return;
        }


        /*
          Default the date to today.
        */

        const today =
          new Date()
            .toISOString()
            .split("T")[0];


        document.getElementById(
          "guinnessDate"
        ).value = today;


        /*
          Clear previous form values.
        */

        document.getElementById(
          "guinnessRating"
        ).value = "";

        document.getElementById(
          "guinnessPrice"
        ).value = "";

        document.getElementById(
          "guinnessNotes"
        ).value = "";


        document.getElementById(
          "guinnessError"
        ).textContent = "";

        document.getElementById(
          "guinnessSuccess"
        ).textContent = "";


        /*
          Reload pubs so the dropdown is current.
        */

        await loadPubs();


        guinnessModal.style.display =
          "flex";
      }
    );


    document.getElementById(
      "closeGuinnessButton"
    ).addEventListener(
      "click",
      () => {

        guinnessModal.style.display =
          "none";
      }
    );


    /* =========================================================
       SAVE GUINNESS
       ========================================================= */

    document.getElementById(
      "saveGuinnessButton"
    ).addEventListener(
      "click",
      async () => {

        const pubId =
          document.getElementById(
            "guinnessPub"
          ).value;


        const date =
          document.getElementById(
            "guinnessDate"
          ).value;


        const rating =
          document.getElementById(
            "guinnessRating"
          ).value;


        const price =
          document.getElementById(
            "guinnessPrice"
          ).value;


        const notes =
          document.getElementById(
            "guinnessNotes"
          ).value.trim();


        const errorBox =
          document.getElementById(
            "guinnessError"
          );


        const successBox =
          document.getElementById(
            "guinnessSuccess"
          );


        errorBox.textContent = "";
        successBox.textContent = "";


        /*
          Basic validation.
        */

        if (!pubId) {

          errorBox.textContent =
            "Please choose a pub.";

          return;
        }


        if (!date) {

          errorBox.textContent =
            "Please choose a date.";

          return;
        }


        if (
          rating !== "" &&
          (
            Number(rating) < 1 ||
            Number(rating) > 5
          )
        ) {

          errorBox.textContent =
            "Rating must be between 1 and 5.";

          return;
        }


        if (
          price !== "" &&
          Number(price) < 0
        ) {

          errorBox.textContent =
            "Price cannot be negative.";

          return;
        }


        /*
          Insert Guinness record.
        */

        const {
          error
        } =
          await supabaseClient
            .from("guinesses")
            .insert({

              pub_id:
                Number(pubId),

              date:
                date,

              rating:
                rating
                  ? Number(rating)
                  : null,

              price:
                price
                  ? Number(price)
                  : null,

              notes:
                notes || null

            });


        if (error) {

          console.error(
            "Error saving Guinness:",
            error
          );

          errorBox.textContent =
            error.message;

          return;
        }


        /*
          Show success.
        */

        successBox.textContent =
          "Guinness saved.";


        /*
          Refresh map.
        */

        await loadPubs();


        /*
          Clear form.
        */

        document.getElementById(
          "guinnessRating"
        ).value = "";

        document.getElementById(
          "guinnessPrice"
        ).value = "";

        document.getElementById(
          "guinnessNotes"
        ).value = "";


        /*
          Close modal after a short delay.
        */

        setTimeout(
          () => {

            guinnessModal.style.display =
              "none";

          },
          700
        );

      }
    );


    /* =========================================================
       ADD PUB MODAL
       ========================================================= */

    addPubButton.addEventListener(
      "click",
      () => {

        document.getElementById(
          "pubName"
        ).value = "";

        document.getElementById(
          "pubTown"
        ).value = "";

        document.getElementById(
          "pubLatitude"
        ).value = "";

        document.getElementById(
          "pubLongitude"
        ).value = "";


        document.getElementById(
          "pubError"
        ).textContent = "";

        document.getElementById(
          "pubSuccess"
        ).textContent = "";


        pubModal.style.display =
          "flex";

      }
    );


    document.getElementById(
      "closePubButton"
    ).addEventListener(
      "click",
      () => {

        pubModal.style.display =
          "none";
      }
    );


    /* =========================================================
       USE CURRENT LOCATION FOR NEW PUB
       ========================================================= */

    document.getElementById(
      "usePubLocationButton"
    ).addEventListener(
      "click",
      () => {

        if (!navigator.geolocation) {

          document.getElementById(
            "pubError"
          ).textContent =
            "Location is not supported by this browser.";

          return;
        }


        document.getElementById(
          "pubError"
        ).textContent =
          "Finding your location...";


        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;


            document.getElementById(
              "pubLatitude"
            ).value =
              latitude.toFixed(6);


            document.getElementById(
              "pubLongitude"
            ).value =
              longitude.toFixed(6);


            document.getElementById(
              "pubError"
            ).textContent = "";

          },

          error => {

            console.error(error);

            document.getElementById(
              "pubError"
            ).textContent =
              "Could not get your location.";

          },

          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }

        );

      }
    );


    /* =========================================================
       SAVE PUB
       ========================================================= */

    document.getElementById(
      "savePubButton"
    ).addEventListener(
      "click",
      async () => {

        const name =
          document.getElementById(
            "pubName"
          ).value.trim();


        const town =
          document.getElementById(
            "pubTown"
          ).value.trim();


        const latitude =
          document.getElementById(
            "pubLatitude"
          ).value;


        const longitude =
          document.getElementById(
            "pubLongitude"
          ).value;


        const errorBox =
          document.getElementById(
            "pubError"
          );


        const successBox =
          document.getElementById(
            "pubSuccess"
          );


        errorBox.textContent = "";
        successBox.textContent = "";


        /*
          Validation.
        */

        if (!name) {

          errorBox.textContent =
            "Please enter the pub name.";

          return;
        }


        if (!town) {

          errorBox.textContent =
            "Please enter the town.";

          return;
        }


        if (latitude === "" || longitude === "") {

          errorBox.textContent =
            "Please enter latitude and longitude, or use current location.";

          return;
        }


        if (
          isNaN(Number(latitude)) ||
          isNaN(Number(longitude))
        ) {

          errorBox.textContent =
            "Latitude and longitude must be numbers.";

          return;
        }


        /*
          Insert the pub.
        */

        const {
          error
        } =
          await supabaseClient
            .from("pubs")
            .insert({

              name:
                name,

              town:
                town,

              latitude:
                Number(latitude),

              longitude:
                Number(longitude)

            });


        if (error) {

          console.error(
            "Error saving pub:",
            error
          );

          errorBox.textContent =
            error.message;

          return;
        }


        successBox.textContent =
          "Pub saved.";


        /*
          Refresh the map.
        */

        await loadPubs();


        /*
          Close after a short delay.
        */

        setTimeout(
          () => {

            pubModal.style.display =
              "none";

          },
          700
        );

      }
    );


    /* =========================================================
       TOWN SEARCH
       ========================================================= */

    async function searchTown() {

      const searchText =
        document.getElementById(
          "townSearch"
        ).value.trim();


      if (!searchText) {
        return;
      }


      const searchButton =
        document.getElementById(
          "searchButton"
        );


      searchButton.disabled = true;

      searchButton.textContent =
        "Searching...";


      try {

        const url =
          "https://nominatim.openstreetmap.org/search" +
          "?format=json" +
          "&limit=1" +
          "&countrycodes=gb" +
          "&q=" +
          encodeURIComponent(searchText);


        const response =
          await fetch(
            url,
            {
              headers: {
                "Accept":
                  "application/json"
              }
            }
          );


        const results =
          await response.json();


        if (
          !results ||
          results.length === 0
        ) {

          alert(
            "Town not found."
          );

          return;
        }


        const result =
          results[0];


        const latitude =
          Number(result.lat);


        const longitude =
          Number(result.lon);


        map.setView(
          [
            latitude,
            longitude
          ],
          13
        );


      } catch (error) {

        console.error(
          "Town search error:",
          error
        );


        alert(
          "There was a problem searching for that town."
        );


      } finally {

        searchButton.disabled =
          false;

        searchButton.textContent =
          "Search";

      }

    }


    document.getElementById(
      "searchButton"
    ).addEventListener(
      "click",
      searchTown
    );


    document.getElementById(
      "townSearch"
    ).addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          searchTown();

        }

      }
    );


    /* =========================================================
       CURRENT LOCATION
       ========================================================= */

    document.getElementById(
      "locationButton"
    ).addEventListener(
      "click",
      () => {

        if (!navigator.geolocation) {

          alert(
            "Location is not supported by this browser."
          );

          return;
        }


        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;


            /*
              Move map to current location.
            */

            map.setView(
              [
                latitude,
                longitude
              ],
              15
            );


            /*
              Remove old temporary location marker.
            */

            if (
              currentLocationMarker
            ) {

              map.removeLayer(
                currentLocationMarker
              );

            }


            /*
              Add a temporary circle showing
              current location.
            */

            currentLocationMarker =
              L.circleMarker(
                [
                  latitude,
                  longitude
                ],
                {
                  radius: 8,
                  color: "white",
                  weight: 3,
                  fillColor: "black",
                  fillOpacity: 1
                }
              )
              .bindPopup(
                "Your current location"
              )
              .addTo(map);

          },

          error => {

            console.error(error);

            alert(
              "Could not get your current location."
            );

          },

          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }

        );

      }
    );


    /* =========================================================
       CLOSE MODALS WHEN CLICKING OUTSIDE THEM
       ========================================================= */

    window.addEventListener(
      "click",
      event => {

        if (
          event.target === loginModal
        ) {

          loginModal.style.display =
            "none";
        }


        if (
          event.target === guinnessModal
        ) {

          guinnessModal.style.display =
            "none";
        }


        if (
          event.target === pubModal
        ) {

          pubModal.style.display =
            "none";
        }

      }
    );


    /* =========================================================
       INITIALISE
       ========================================================= */

    async function initialise() {

      /*
        Check whether the user is already logged in.
      */

      await updateLoginState();


      /*
        Load pubs and Guinness records.
      */

      await loadPubs();

    }


    initialise();

  </script>

</body>
</html>
