<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rob's Guinness Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: #111;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    #map {
      height: calc(100vh - 58px);
      width: 100%;
    }

    /* Search box */
    .search-box {
      background: white;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .search-box input {
      width: 180px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    .search-box button {
      margin-left: 5px;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    /* Location button */
    .location-button {
      background: white;
      width: 42px;
      height: 42px;
      border-radius: 6px;
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 22px;
      cursor: pointer;
    }

    /* Guinness marker */
    .guinness-marker {
      width: 32px;
      height: 32px;
      background: #000;
      border: 3px solid #fff;
      border-radius: 50%;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      font-weight: bold;

      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

  <header>
    Rob's Guinness Map
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* -----------------------------
       SUPABASE
    ----------------------------- */

    const SUPABASE_URL = "https://pteassljmnepsbfzxjks.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xlodpsQzM2DOUbBDgMcZIg_KkS-ZOTl";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* -----------------------------
       MAP
    ----------------------------- */

    const map = L.map("map").setView(
      [54.65, -3.55],
      10
    );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /* -----------------------------
       LOCATION BUTTON
    ----------------------------- */

    const LocationControl = L.Control.extend({

      options: {
        position: "topleft"
      },

      onAdd: function() {

        const button = L.DomUtil.create(
          "button",
          "location-button"
        );

        button.innerHTML = "⌖";
        button.title = "Go to my current location";

        L.DomEvent.disableClickPropagation(button);

        button.onclick = function() {

          if (!navigator.geolocation) {
            alert("Location is not supported by your browser.");
            return;
          }

          navigator.geolocation.getCurrentPosition(

            function(position) {

              const latitude =
                position.coords.latitude;

              const longitude =
                position.coords.longitude;

              map.setView(
                [latitude, longitude],
                15
              );

              L.marker([
                latitude,
                longitude
              ])
              .addTo(map)
              .bindPopup("Your current location")
              .openPopup();

            },

            function(error) {

              alert(
                "Unable to get your location. Please allow location access."
              );

            },

            {
              enableHighAccuracy: true,
              timeout: 10000
            }

          );

        };

        return button;
      }

    });

    map.addControl(
      new LocationControl()
    );


    /* -----------------------------
       SEARCH BOX
    ----------------------------- */

    const SearchControl = L.Control.extend({

      options: {
        position: "topright"
      },

      onAdd: function() {

        const container = L.DomUtil.create(
          "div",
          "search-box"
        );

        container.innerHTML = `
          <input
            id="townSearch"
            type="text"
            placeholder="Search town..."
          >
          <button id="searchButton">
            Search
          </button>
        `;

        L.DomEvent.disableClickPropagation(
          container
        );

        setTimeout(function() {

          document
            .getElementById("searchButton")
            .onclick = searchTown;

          document
            .getElementById("townSearch")
            .addEventListener(
              "keydown",
              function(event) {

                if (event.key === "Enter") {
                  searchTown();
                }

              }
            );

        }, 0);

        return container;
      }

    });

    map.addControl(
      new SearchControl()
    );


    /* -----------------------------
       TOWN SEARCH
    ----------------------------- */

    async function searchTown() {

      const input =
        document.getElementById("townSearch");

      const town =
        input.value.trim();

      if (!town) {
        return;
      }

      try {

        const response = await fetch(
          "https://nominatim.openstreetmap.org/search?" +
          new URLSearchParams({
            q: town,
            format: "json",
            limit: "1"
          })
        );

        const results =
          await response.json();

        if (results.length === 0) {

          alert(
            "Town not found."
          );

          return;
        }

        const latitude =
          parseFloat(results[0].lat);

        const longitude =
          parseFloat(results[0].lon);

        map.setView(
          [latitude, longitude],
          13
        );

      }

      catch (error) {

        console.error(error);

        alert(
          "There was a problem searching for the town."
        );

      }

    }


    /* -----------------------------
       LOAD PUBS
    ----------------------------- */

    async function loadPubs() {

      const {
        data: pubs,
        error: pubsError
      } = await supabaseClient
        .from("pubs")
        .select("*");


      if (pubsError) {

        console.error(
          "Error loading pubs:",
          pubsError
        );

        return;
      }


      const {
        data: guinnesses,
        error: guinnessError
      } = await supabaseClient
        .from("guinesses")
        .select("*");


      if (guinnessError) {

        console.error(
          "Error loading Guinnesses:",
          guinnessError
        );

        return;
      }


      pubs.forEach(pub => {

        const count =
          guinnesses.filter(
            guinness =>
              guinness.pub_id === pub.id
          ).length;


        const icon =
          L.divIcon({

            className: "",

            html: `
              <div class="guinness-marker">
                <div class="pint-glass"></div>
                <div class="pint-head"></div>
                <div class="pint-count">
                  ${count}
                </div>
              </div>
            `,

            iconSize: [32, 42],

            iconAnchor: [16, 42],

            popupAnchor: [0, -42]

          });


        L.marker(
          [pub.latitude, pub.longitude],
          { icon: icon }
        )
        .addTo(map)
        .bindPopup(`
          <strong>${pub.name}</strong><br>
          ${pub.town}<br><br>
          Guinnesses here: ${count}
        `);

      });

    }


    loadPubs();

  </script>

</body>
</html>
