<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rob's Guinness Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      height: 55px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 5px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #loginButton,
    #addGuinnessButton {
      background: white;
      color: #111;
    }

    #logoutButton {
      background: #555;
      color: white;
    }

    #loggedInText {
      font-size: 14px;
      display: none;
    }

    #map {
      height: calc(100vh - 55px);
    }

    .guinness-marker {
      width: 32px;
      height: 32px;
      background: black;
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      box-sizing: border-box;
    }

    .search-box {
      position: absolute;
      top: 70px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 8px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
    }

    .search-box input {
      width: 140px;
      padding: 7px;
      box-sizing: border-box;
    }

    .location-button {
      position: absolute;
      top: 70px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 9px 12px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .modal-content {
      background: white;
      width: calc(100% - 30px);
      max-width: 420px;
      margin: 80px auto;
      padding: 20px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .form-row {
      margin-bottom: 15px;
    }

    .form-row label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      padding: 9px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .form-row textarea {
      min-height: 80px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .save-button {
      background: #111;
      color: white;
      flex: 1;
    }

    .cancel-button {
      background: #ddd;
      color: #111;
      flex: 1;
    }

    #guinnessMessage {
      margin-top: 12px;
      font-size: 14px;
    }

    /* Login modal */

    .login-box {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .login-content {
      background: white;
      width: calc(100% - 30px);
      max-width: 400px;
      margin: 100px auto;
      padding: 20px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .login-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    #submitLogin {
      width: 100%;
      background: #111;
      color: white;
    }

    #loginMessage {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Rob's Guinness Map</h1>

  <div class="header-buttons">
    <span id="loggedInText">Logged in</span>

    <button id="addGuinnessButton" style="display:none;">
      + Add Guinness
    </button>

    <button id="loginButton">
      Login
    </button>

    <button id="logoutButton" style="display:none;">
      Logout
    </button>
  </div>
</header>

<div id="map"></div>

<div class="search-box">
  <input
    id="townSearch"
    type="text"
    placeholder="Search town"
  >
  <button id="searchButton">Search</button>
</div>

<button class="location-button" id="locationButton">
  Current location
</button>


<!-- Login modal -->

<div class="login-box" id="loginBox">

  <div class="login-content">

    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="submitLogin">
      Login
    </button>

    <p id="loginMessage"></p>

  </div>

</div>


<!-- Add Guinness modal -->

<div class="modal" id="guinnessModal">

  <div class="modal-content">

    <h2>Add Guinness</h2>

    <div class="form-row">
      <label for="pubSelect">Pub</label>

      <select id="pubSelect">
        <option value="">Choose a pub</option>
      </select>
    </div>

    <div class="form-row">
      <label for="guinnessDate">Date</label>

      <input
        type="date"
        id="guinnessDate"
      >
    </div>

    <div class="form-row">
      <label for="guinnessRating">Rating</label>

      <input
        type="number"
        id="guinnessRating"
        min="1"
        max="10"
        placeholder="1-10"
      >
    </div>

    <div class="form-row">
      <label for="guinnessPrice">Price</label>

      <input
        type="number"
        id="guinnessPrice"
        min="0"
        step="0.01"
        placeholder="e.g. 5.50"
      >
    </div>

    <div class="form-row">
      <label for="guinnessNotes">Notes</label>

      <textarea
        id="guinnessNotes"
        placeholder="Any notes about this Guinness..."
      ></textarea>
    </div>

    <div class="modal-buttons">

      <button
        class="cancel-button"
        id="cancelGuinness"
      >
        Cancel
      </button>

      <button
        class="save-button"
        id="saveGuinness"
      >
        Save Guinness
      </button>

    </div>

    <p id="guinnessMessage"></p>

  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL = "https://pteassljmnepsbfzxjks.supabase.co";
  const SUPABASE_KEY = "sb_publishable_xlodpsQzM2DOUbBDgMcZIg_KkS-ZOTl";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =========================
     MAP
  ========================= */

  const map = L.map("map").setView(
    [54.6, -3.3],
    9
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  /* =========================
     MARKER LAYER
  ========================= */

  const markerLayer = L.layerGroup().addTo(map);


  /* =========================
     LOGIN ELEMENTS
  ========================= */

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const loggedInText =
    document.getElementById("loggedInText");

  const loginBox =
    document.getElementById("loginBox");

  const submitLogin =
    document.getElementById("submitLogin");

  const loginMessage =
    document.getElementById("loginMessage");

  const addGuinnessButton =
    document.getElementById("addGuinnessButton");


  /* =========================
     GUINNESS FORM ELEMENTS
  ========================= */

  const guinnessModal =
    document.getElementById("guinnessModal");

  const pubSelect =
    document.getElementById("pubSelect");

  const guinnessDate =
    document.getElementById("guinnessDate");

  const guinnessRating =
    document.getElementById("guinnessRating");

  const guinnessPrice =
    document.getElementById("guinnessPrice");

  const guinnessNotes =
    document.getElementById("guinnessNotes");

  const saveGuinness =
    document.getElementById("saveGuinness");

  const cancelGuinness =
    document.getElementById("cancelGuinness");

  const guinnessMessage =
    document.getElementById("guinnessMessage");


  /* =========================
     LOGIN
  ========================= */

  loginButton.addEventListener("click", () => {

    loginBox.style.display = "block";

  });


  submitLogin.addEventListener("click", async () => {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    loginMessage.textContent = "Logging in...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      loginMessage.textContent =
        error.message;

      return;
    }

    loginMessage.textContent = "";

    loginBox.style.display = "none";

    updateLoginUI(true);

  });


  logoutButton.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    updateLoginUI(false);

  });


  function updateLoginUI(loggedIn) {

    if (loggedIn) {

      loginButton.style.display = "none";

      logoutButton.style.display = "block";

      loggedInText.style.display = "block";

      addGuinnessButton.style.display = "block";

    } else {

      loginButton.style.display = "block";

      logoutButton.style.display = "none";

      loggedInText.style.display = "none";

      addGuinnessButton.style.display = "none";

    }

  }


  /* =========================
     CHECK EXISTING LOGIN
  ========================= */

  async function checkLogin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    updateLoginUI(!!session);

  }

  checkLogin();


  /* =========================
     LOAD PUBS
  ========================= */

  async function loadPubs() {

    markerLayer.clearLayers();

    const { data: pubs, error: pubsError } =
      await supabaseClient
        .from("pubs")
        .select("*");

    if (pubsError) {

      console.error(pubsError);

      return;
    }


    const { data: guinesses, error: guinnessError } =
      await supabaseClient
        .from("guinesses")
        .select("*");

    if (guinnessError) {

      console.error(guinnessError);

      return;
    }


    pubs.forEach(pub => {

      const count =
        guinesses.filter(
          g => g.pub_id === pub.id
        ).length;


      const icon = L.divIcon({

        className: "",

        html:
          `<div class="guinness-marker">${count}</div>`,

        iconSize: [38, 38],

        iconAnchor: [19, 19],

        popupAnchor: [0, -20]

      });


      L.marker(
        [pub.latitude, pub.longitude],
        { icon }
      )
      .bindPopup(
        `<strong>${pub.name}</strong><br>${pub.town}<br>${count} Guinness${count === 1 ? "" : "es"}`
      )
      .addTo(markerLayer);

    });


    /* Populate pub dropdown */

    pubSelect.innerHTML =
      '<option value="">Choose a pub</option>';

    pubs.forEach(pub => {

      const option =
        document.createElement("option");

      option.value = pub.id;

      option.textContent =
        `${pub.name} — ${pub.town}`;

      pubSelect.appendChild(option);

    });

  }


  loadPubs();


  /* =========================
     ADD GUINNESS
  ========================= */

  addGuinnessButton.addEventListener(
    "click",
    () => {

      guinnessMessage.textContent = "";

      guinnessDate.value =
        new Date().toISOString().split("T")[0];

      guinnessModal.style.display = "block";

    }
  );


  /* =========================
     CANCEL
  ========================= */

  cancelGuinness.addEventListener(
    "click",
    () => {

      guinnessModal.style.display = "none";

    }
  );


  /* =========================
     SAVE GUINNESS
  ========================= */

  saveGuinness.addEventListener(
    "click",
    async () => {

      const pubId =
        pubSelect.value;

      const date =
        guinnessDate.value;

      const rating =
        guinnessRating.value;

      const price =
        guinnessPrice.value;

      const notes =
        guinnessNotes.value;


      if (!pubId) {

        guinnessMessage.textContent =
          "Please choose a pub.";

        return;
      }


      if (!date) {

        guinnessMessage.textContent =
          "Please choose a date.";

        return;
      }


      saveGuinness.disabled = true;

      guinnessMessage.textContent =
        "Saving...";


      const { error } =
        await supabaseClient
          .from("guinesses")
          .insert({

            pub_id: Number(pubId),

            date: date,

            rating:
              rating ? Number(rating) : null,

            price:
              price ? Number(price) : null,

            notes:
              notes || null

          });


      if (error) {

        console.error(error);

        guinnessMessage.textContent =
          error.message;

        saveGuinness.disabled = false;

        return;
      }


      guinnessMessage.textContent =
        "Guinness saved.";

      saveGuinness.disabled = false;


      setTimeout(() => {

        guinnessModal.style.display =
          "none";

        guinnessRating.value = "";

        guinnessPrice.value = "";

        guinnessNotes.value = "";

        loadPubs();

      }, 500);

    }
  );


  /* =========================
     TOWN SEARCH
  ========================= */

  async function searchTown() {

    const town =
      document.getElementById("townSearch").value;

    if (!town) return;


    const response =
      await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(town)}`
      );

    const results =
      await response.json();


    if (results.length === 0) {

      alert("Town not found.");

      return;
    }


    const lat =
      Number(results[0].lat);

    const lon =
      Number(results[0].lon);


    map.setView(
      [lat, lon],
      13
    );

  }


  document
    .getElementById("searchButton")
    .addEventListener(
      "click",
      searchTown
    );


  document
    .getElementById("townSearch")
    .addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          searchTown();

        }

      }
    );


  /* =========================
     CURRENT LOCATION
  ========================= */

  document
    .getElementById("locationButton")
    .addEventListener(
      "click",
      () => {

        if (!navigator.geolocation) {

          alert(
            "Location is not available on this device."
          );

          return;
        }


        navigator.geolocation.getCurrentPosition(
          position => {

            const lat =
              position.coords.latitude;

            const lon =
              position.coords.longitude;


            map.setView(
              [lat, lon],
              15
            );


            L.circleMarker(
              [lat, lon],
              {
                radius: 8
              }
            )
            .addTo(map)
            .bindPopup("Your current location")
            .openPopup();

          },

          () => {

            alert(
              "Unable to get your location."
            );

          }

        );

      }
    );

</script>

</body>
</html>
