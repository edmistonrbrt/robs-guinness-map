<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rob's Guinness Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: #111;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    #map {
      height: calc(100vh - 58px);
      width: 100%;
    }

    .guinness-marker {
      width: 34px;
      height: 34px;
      background: #111;
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>

  <header>
    Rob's Guinness Map
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://pteassljmnepsbfzxjks.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xlodpsQzM2DOUbBDgMcZIg_KkS-ZOTl";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const map = L.map("map").setView([54.65, -3.55], 10);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    async function loadPubs() {

      const { data: pubs, error: pubsError } =
        await supabaseClient
          .from("pubs")
          .select("*");

      if (pubsError) {
        console.error("Error loading pubs:", pubsError);
        return;
      }

      const { data: guinnesses, error: guinnessError } =
        await supabaseClient
          .from("guinnesses")
          .select("*");

      if (guinnessError) {
        console.error("Error loading Guinnesses:", guinnessError);
        return;
      }

      pubs.forEach(pub => {

        const count = guinnesses.filter(
          guinness => guinness.pub_id === pub.id
        ).length;

        const icon = L.divIcon({
          className: "",
          html: `
            <div class="guinness-marker">
              ${count}
            </div>
          `,
          iconSize: [40, 40],
          iconAnchor: [20, 20],
          popupAnchor: [0, -20]
        });

        L.marker(
          [pub.latitude, pub.longitude],
          { icon: icon }
        )
        .addTo(map)
        .bindPopup(`
          <strong>${pub.name}</strong><br>
          ${pub.town}<br><br>
          Guinnesses here: ${count}
        `);
      });
    }

    loadPubs();
  </script>

</body>
</html>
