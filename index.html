<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rob's Guinness Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>

    /* -----------------------------
       PAGE
    ----------------------------- */

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: #111;
      color: white;
      font-size: 20px;
      font-weight: bold;
      box-sizing: border-box;
    }

    #map {
      height: calc(100vh - 58px);
      width: 100%;
    }


    /* -----------------------------
       GUINNESS MARKERS
    ----------------------------- */

    .guinness-marker {
      width: 32px;
      height: 32px;
      background: #000;
      border: 3px solid #fff;
      border-radius: 50%;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      font-weight: bold;

      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }


    /* -----------------------------
       TOWN SEARCH
    ----------------------------- */

    .search-box {
      background: white;
      padding: 6px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);

      display: flex;
    }

    .search-box input {
      width: 150px;
      padding: 8px;

      border: 1px solid #ccc;
      border-radius: 4px;

      font-size: 16px;
    }

    .search-box button {
      margin-left: 5px;
      padding: 8px 10px;

      border: none;
      border-radius: 4px;

      background: #111;
      color: white;

      font-size: 14px;
      cursor: pointer;
    }


    /* -----------------------------
       CURRENT LOCATION BUTTON
    ----------------------------- */

    .location-button {
      background: white;

      width: 40px;
      height: 40px;

      border: 2px solid rgba(0, 0, 0, 0.3);
      border-radius: 4px;

      font-size: 24px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

  </style>
</head>


<body>

  <header>
    Rob's Guinness Map
  </header>

  <div id="map"></div>


  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://pteassljmnepsbfzxjks.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_xlodpsQzM2DOUbBDgMcZIg_KkS-ZOTl";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       CREATE MAP
       ===================================================== */

    const map =
      L.map("map").setView(
        [54.65, -3.55],
        10
      );


    /* =====================================================
       OPENSTREETMAP
       ===================================================== */

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);



    /* =====================================================
       CURRENT LOCATION
       ===================================================== */

    let currentLocationMarker;


    const LocationControl =
      L.Control.extend({

        options: {
          position: "topleft"
        },


        onAdd: function () {

          const button =
            L.DomUtil.create(
              "button",
              "location-button"
            );


          button.innerHTML = "◎";

          button.title =
            "Go to my current location";


          L.DomEvent.disableClickPropagation(
            button
          );


          button.onclick = function () {


            if (!navigator.geolocation) {

              alert(
                "Location is not supported by your browser."
              );

              return;
            }


            navigator.geolocation
              .getCurrentPosition(

                function (position) {


                  const latitude =
                    position.coords.latitude;

                  const longitude =
                    position.coords.longitude;


                  /* Zoom to location */

                  map.setView(
                    [latitude, longitude],
                    15
                  );


                  /* Remove old location marker */

                  if (currentLocationMarker) {

                    map.removeLayer(
                      currentLocationMarker
                    );

                  }


                  /* Add current location marker */

                  currentLocationMarker =
                    L.circleMarker(
                      [latitude, longitude],
                      {
                        radius: 7,
                        fillOpacity: 1
                      }
                    )
                    .addTo(map)
                    .bindPopup(
                      "Your current location"
                    );


                },


                function () {

                  alert(
                    "Unable to get your location. Please allow location access."
                  );

                },


                {
                  enableHighAccuracy: true,
                  timeout: 10000
                }

              );

          };


          return button;

        }

      });


    map.addControl(
      new LocationControl()
    );



    /* =====================================================
       TOWN SEARCH BOX
       ===================================================== */

    const SearchControl =
      L.Control.extend({

        options: {
          position: "topright"
        },


        onAdd: function () {


          const container =
            L.DomUtil.create(
              "div",
              "search-box"
            );


          container.innerHTML = `

            <input
              id="townSearch"
              type="text"
              placeholder="Search town..."
            >

            <button id="searchButton">
              Search
            </button>

          `;


          /* Stop map moving while using search */

          L.DomEvent.disableClickPropagation(
            container
          );


          L.DomEvent.disableScrollPropagation(
            container
          );


          setTimeout(function () {


            const searchButton =
              document.getElementById(
                "searchButton"
              );


            const searchInput =
              document.getElementById(
                "townSearch"
              );


            searchButton.onclick =
              searchTown;


            searchInput.addEventListener(
              "keydown",
              function (event) {

                if (event.key === "Enter") {

                  searchTown();

                }

              }
            );


          }, 0);


          return container;

        }

      });


    map.addControl(
      new SearchControl()
    );



    /* =====================================================
       SEARCH FOR A TOWN
       ===================================================== */

    async function searchTown() {


      const input =
        document.getElementById(
          "townSearch"
        );


      const town =
        input.value.trim();


      if (!town) {

        return;

      }


      try {


        const response =
          await fetch(

            "https://nominatim.openstreetmap.org/search?" +

            new URLSearchParams({

              q: town,

              format: "json",

              limit: "1"

            })

          );


        const results =
          await response.json();


        if (results.length === 0) {

          alert(
            "Town not found."
          );

          return;

        }


        const latitude =
          parseFloat(
            results[0].lat
          );


        const longitude =
          parseFloat(
            results[0].lon
          );


        map.setView(
          [latitude, longitude],
          13
        );


      }


      catch (error) {


        console.error(
          "Town search error:",
          error
        );


        alert(
          "There was a problem searching for the town."
        );


      }

    }



    /* =====================================================
       LOAD PUBS FROM SUPABASE
       ===================================================== */

    async function loadPubs() {


      /* Get pubs */

      const {
        data: pubs,
        error: pubsError
      } =
        await supabaseClient
          .from("pubs")
          .select("*");


      if (pubsError) {

        console.error(
          "Error loading pubs:",
          pubsError
        );

        return;

      }



      /* Get Guinness records

         IMPORTANT:
         Your table is currently called
         "guinesses" with one N.
      */

      const {
        data: guinnesses,
        error: guinnessError
      } =
        await supabaseClient
          .from("guinesses")
          .select("*");


      if (guinnessError) {

        console.error(
          "Error loading Guinnesses:",
          guinnessError
        );

        return;

      }



      /* =================================================
         CREATE A MARKER FOR EACH PUB
         ================================================= */

      pubs.forEach(function (pub) {


        /* Count Guinnesses at this pub */

        const count =
          guinnesses.filter(

            function (guinness) {

              return (
                guinness.pub_id === pub.id
              );

            }

          ).length;



        /* Create black circular marker */

        const icon =
          L.divIcon({

            className: "",

            html: `
              <div class="guinness-marker">
                ${count}
              </div>
            `,

            iconSize: [
              38,
              38
            ],

            iconAnchor: [
              19,
              19
            ],

            popupAnchor: [
              0,
              -20
            ]

          });



        /* Add marker to map */

        L.marker(
          [
            pub.latitude,
            pub.longitude
          ],
          {
            icon: icon
          }
        )

        .addTo(map)

        .bindPopup(`

          <strong>
            ${pub.name}
          </strong>

          <br>

          ${pub.town}

          <br><br>

          Guinnesses here:
          ${count}

        `);


      });

    }



    /* =====================================================
       START
       ===================================================== */

    loadPubs();


  </script>

</body>

</html>
