<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rob's Guinness Map</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #111;
      color: white;
      font-size: 20px;
      font-weight: bold;
      box-sizing: border-box;
    }

    #loginButton,
    #logoutButton {
      background: white;
      color: #111;
      border: none;
      border-radius: 5px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #userStatus {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: normal;
    }

    #map {
      height: calc(100vh - 58px);
      width: 100%;
    }


    /* =========================
       LOGIN BOX
       ========================= */

    .login-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: calc(100% - 40px);
      max-width: 350px;

      background: white;
      padding: 24px;

      border-radius: 10px;

      box-shadow: 0 4px 20px rgba(0,0,0,0.3);

      z-index: 2000;
      box-sizing: border-box;
    }

    .login-box h2 {
      margin-top: 0;
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;

      padding: 12px;
      margin-bottom: 10px;

      border: 1px solid #ccc;
      border-radius: 5px;

      font-size: 16px;
    }

    .login-box button {
      width: 100%;

      padding: 12px;

      background: #111;
      color: white;

      border: none;
      border-radius: 5px;

      font-size: 16px;
      cursor: pointer;
    }

    .login-message {
      margin-top: 10px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }


    /* =========================
       MARKERS
       ========================= */

    .guinness-marker {
      width: 32px;
      height: 32px;

      background: #000;

      border: 3px solid #fff;
      border-radius: 50%;

      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      font-weight: bold;

      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }


    /* =========================
       SEARCH
       ========================= */

    .search-box {
      background: white;
      padding: 6px;

      border-radius: 6px;

      box-shadow: 0 2px 6px rgba(0,0,0,0.3);

      display: flex;
    }

    .search-box input {
      width: 150px;

      padding: 8px;

      border: 1px solid #ccc;
      border-radius: 4px;

      font-size: 16px;
    }

    .search-box button {
      margin-left: 5px;

      padding: 8px 10px;

      border: none;
      border-radius: 4px;

      background: #111;
      color: white;

      font-size: 14px;
    }


    /* =========================
       LOCATION
       ========================= */

    .location-button {
      background: white;

      width: 40px;
      height: 40px;

      border: 2px solid rgba(0,0,0,0.3);
      border-radius: 4px;

      font-size: 24px;

      cursor: pointer;

      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header>

    <div>
      Rob's Guinness Map
    </div>

    <div id="userStatus">

      <span id="loggedInText" class="hidden">
        Logged in
      </span>

      <button id="loginButton">
        Login
      </button>

      <button id="logoutButton" class="hidden">
        Logout
      </button>

    </div>

  </header>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <!-- =========================
       LOGIN WINDOW
       ========================= -->

  <div
    id="loginBox"
    class="login-box hidden"
  >

    <h2>
      Login
    </h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="submitLogin">
      Login
    </button>

    <div
      id="loginMessage"
      class="login-message"
    ></div>

  </div>


  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://pteassljmnepsbfzxjks.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_xlodpsQzM2DOUbBDgMcZIg_KkS-ZOTl";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =====================================================
       MAP
       ===================================================== */

    const map =
      L.map("map").setView(
        [54.65, -3.55],
        10
      );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);



    /* =====================================================
       LOGIN ELEMENTS
       ===================================================== */

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );

    const loginBox =
      document.getElementById(
        "loginBox"
      );

    const submitLogin =
      document.getElementById(
        "submitLogin"
      );

    const loggedInText =
      document.getElementById(
        "loggedInText"
      );

    const loginMessage =
      document.getElementById(
        "loginMessage"
      );



    /* =====================================================
       OPEN LOGIN
       ===================================================== */

    loginButton.onclick =
      function () {

        loginBox.classList.remove(
          "hidden"
        );

        loginMessage.textContent = "";

      };



    /* =====================================================
       LOGIN
       ===================================================== */

    submitLogin.onclick =
      async function () {


        const email =
          document.getElementById(
            "email"
          ).value.trim();


        const password =
          document.getElementById(
            "password"
          ).value;


        if (!email || !password) {

          loginMessage.textContent =
            "Please enter your email and password.";

          return;

        }


        loginMessage.textContent =
          "Logging in...";


        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          loginMessage.textContent =
            error.message;

          return;

        }


        loginBox.classList.add(
          "hidden"
        );

        updateLoginDisplay(
          data.user
        );

      };



    /* =====================================================
       LOGOUT
       ===================================================== */

    logoutButton.onclick =
      async function () {

        await supabaseClient.auth.signOut();

        updateLoginDisplay(
          null
        );

      };



    /* =====================================================
       UPDATE LOGIN DISPLAY
       ===================================================== */

    function updateLoginDisplay(
      user
    ) {


      if (user) {

        loginButton.classList.add(
          "hidden"
        );

        logoutButton.classList.remove(
          "hidden"
        );

        loggedInText.classList.remove(
          "hidden"
        );

      }

      else {

        loginButton.classList.remove(
          "hidden"
        );

        logoutButton.classList.add(
          "hidden"
        );

        loggedInText.classList.add(
          "hidden"
        );

      }

    }



    /* =====================================================
       CHECK EXISTING LOGIN
       ===================================================== */

    async function checkLogin() {


      const {
        data
      } =
        await supabaseClient.auth
          .getSession();


      updateLoginDisplay(
        data.session
          ? data.session.user
          : null
      );

    }


    checkLogin();



    /* =====================================================
       CURRENT LOCATION
       ===================================================== */

    let currentLocationMarker;


    const LocationControl =
      L.Control.extend({

        options: {
          position: "topleft"
        },


        onAdd: function () {


          const button =
            L.DomUtil.create(
              "button",
              "location-button"
            );


          button.innerHTML = "◎";

          button.title =
            "Go to my current location";


          L.DomEvent.disableClickPropagation(
            button
          );


          button.onclick =
            function () {


              if (
                !navigator.geolocation
              ) {

                alert(
                  "Location is not supported by your browser."
                );

                return;

              }


              navigator.geolocation
                .getCurrentPosition(

                  function (
                    position
                  ) {


                    const latitude =
                      position.coords.latitude;


                    const longitude =
                      position.coords.longitude;


                    map.setView(
                      [
                        latitude,
                        longitude
                      ],
                      15
                    );


                    if (
                      currentLocationMarker
                    ) {

                      map.removeLayer(
                        currentLocationMarker
                      );

                    }


                    currentLocationMarker =
                      L.circleMarker(

                        [
                          latitude,
                          longitude
                        ],

                        {
                          radius: 7,
                          fillOpacity: 1
                        }

                      )

                      .addTo(map)

                      .bindPopup(
                        "Your current location"
                      );

                  },


                  function () {

                    alert(
                      "Unable to get your location. Please allow location access."
                    );

                  },


                  {
                    enableHighAccuracy: true,
                    timeout: 10000
                  }

                );

            };


          return button;

        }

      });


    map.addControl(
      new LocationControl()
    );



    /* =====================================================
       SEARCH
       ===================================================== */

    const SearchControl =
      L.Control.extend({

        options: {
          position: "topright"
        },


        onAdd: function () {


          const container =
            L.DomUtil.create(
              "div",
              "search-box"
            );


          container.innerHTML = `

            <input
              id="townSearch"
              type="text"
              placeholder="Search town..."
            >

            <button
              id="searchButton"
            >
              Search
            </button>

          `;


          L.DomEvent.disableClickPropagation(
            container
          );

          L.DomEvent.disableScrollPropagation(
            container
          );


          setTimeout(
            function () {


              document
                .getElementById(
                  "searchButton"
                )
                .onclick =
                searchTown;


              document
                .getElementById(
                  "townSearch"
                )
                .addEventListener(
                  "keydown",
                  function (event) {

                    if (
                      event.key === "Enter"
                    ) {

                      searchTown();

                    }

                  }
                );


            },
            0
          );


          return container;

        }

      });


    map.addControl(
      new SearchControl()
    );



    /* =====================================================
       SEARCH TOWN
       ===================================================== */

    async function searchTown() {


      const input =
        document.getElementById(
          "townSearch"
        );


      const town =
        input.value.trim();


      if (!town) {
        return;
      }


      try {


        const response =
          await fetch(

            "https://nominatim.openstreetmap.org/search?" +

            new URLSearchParams({

              q: town,

              format: "json",

              limit: "1"

            })

          );


        const results =
          await response.json();


        if (
          results.length === 0
        ) {

          alert(
            "Town not found."
          );

          return;

        }


        const latitude =
          parseFloat(
            results[0].lat
          );


        const longitude =
          parseFloat(
            results[0].lon
          );


        map.setView(
          [
            latitude,
            longitude
          ],
          13
        );


      }

      catch (error) {

        console.error(
          "Town search error:",
          error
        );

        alert(
          "There was a problem searching for the town."
        );

      }

    }



    /* =====================================================
       LOAD PUBS
       ===================================================== */

    async function loadPubs() {


      const {
        data: pubs,
        error: pubsError
      } =
        await supabaseClient
          .from("pubs")
          .select("*");


      if (pubsError) {

        console.error(
          "Error loading pubs:",
          pubsError
        );

        return;

      }


      const {
        data: guinnesses,
        error: guinnessError
      } =
        await supabaseClient
          .from("guinesses")
          .select("*");


      if (guinnessError) {

        console.error(
          "Error loading Guinnesses:",
          guinnessError
        );

        return;

      }


      pubs.forEach(
        function (pub) {


          const count =
            guinnesses.filter(
              function (guinness) {

                return (
                  guinness.pub_id === pub.id
                );

              }
            ).length;


          const icon =
            L.divIcon({

              className: "",

              html: `

                <div
                  class="guinness-marker"
                >
                  ${count}
                </div>

              `,

              iconSize: [
                38,
                38
              ],

              iconAnchor: [
                19,
                19
              ],

              popupAnchor: [
                0,
                -20
              ]

            });


          L.marker(
            [
              pub.latitude,
              pub.longitude
            ],
            {
              icon: icon
            }
          )

          .addTo(map)

          .bindPopup(`

            <strong>
              ${pub.name}
            </strong>

            <br>

            ${pub.town}

            <br><br>

            Guinnesses here:
            ${count}

          `);


        }
      );

    }


    loadPubs();

  </script>

</body>

</html>
