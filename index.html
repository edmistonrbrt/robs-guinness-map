<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rob's Guinness Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    #map {
      height: calc(100vh - 58px);
      width: 100%;
    }
  </style>
</head>

<body>

  <header>
    Rob's Guinness Map
  </header>

  <div id="map"></div>

  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    // Create the map
    const map = L.map('map').setView([54.662629, -3.366302], 15);

    // Add OpenStreetMap
    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    // The New Cock & Bull
    L.marker([54.662629, -3.366302])
      .addTo(map)
      .bindPopup(
        "<b> The New Cock & Bull</b><br>" +
        "Cockermouth<br>" +
        "Guinness — Thursday 15 October 2026"
      );

  </script>

</body>

</html>
